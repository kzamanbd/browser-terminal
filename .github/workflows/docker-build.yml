name: Build and Push Docker Images

on:
    push:
        branches:
            - master
        tags:
            - 'v*'
    pull_request:
        branches:
            - master

env:
    DOCKER_HUB_USERNAME: kzamanbd
    PROJECT_NAME: web-terminal

jobs:
    build-and-push:
        runs-on: ubuntu-latest

        strategy:
            matrix:
                service: [api, client]

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Login to Docker Hub
              if: github.event_name != 'pull_request'
              uses: docker/login-action@v3
              with:
                  username: ${{ env.DOCKER_HUB_USERNAME }}
                  password: ${{ secrets.DOCKER_HUB_TOKEN }}

            - name: Extract metadata
              id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ${{ env.DOCKER_HUB_USERNAME }}/${{ env.PROJECT_NAME }}-${{ matrix.service }}
                  tags: |
                      type=ref,event=branch
                      type=ref,event=pr
                      type=semver,pattern={{version}}
                      type=semver,pattern={{major}}.{{minor}}
                      type=raw,value=latest,enable={{is_default_branch}}

            - name: Build and push Docker image
              uses: docker/build-push-action@v5
              with:
                  context: .
                  file: ./apps/${{ matrix.service }}/Dockerfile
                  target: production
                  push: ${{ github.event_name != 'pull_request' }}
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

            - name: Update Docker Hub description
              if: github.event_name != 'pull_request' && matrix.service == 'api'
              uses: peter-evans/dockerhub-description@v4
              with:
                  username: ${{ env.DOCKER_HUB_USERNAME }}
                  password: ${{ secrets.DOCKER_HUB_TOKEN }}
                  repository: ${{ env.DOCKER_HUB_USERNAME }}/${{ env.PROJECT_NAME }}-${{ matrix.service }}
                  short-description: 'Browser Terminal ${{ matrix.service }} - A web-based SSH terminal'

