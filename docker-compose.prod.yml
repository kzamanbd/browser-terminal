services:
    # API Service - Production
    api:
        image: kzamanbd/web-terminal-api:latest
        container_name: web-terminal-api-prod
        restart: unless-stopped
        ports:
            - '8081:8081'
        networks:
            - app-network
        environment:
            - NODE_ENV=production
            - API_PORT=8081
            - API_HOST=0.0.0.0
        healthcheck:
            test:
                [
                    'CMD',
                    'wget',
                    '--no-verbose',
                    '--tries=1',
                    '--spider',
                    'http://localhost:8081/health'
                ]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 40s

    # Client Service - Production
    client:
        image: kzamanbd/web-terminal-client:latest
        container_name: web-terminal-client-prod
        restart: unless-stopped
        networks:
            - app-network
        environment:
            - NODE_ENV=production

    # Nginx Reverse Proxy
    nginx:
        image: nginx:alpine
        container_name: web-terminal-nginx-prod
        restart: unless-stopped
        ports:
            - '80:80'
            - '443:443'
        volumes:
            - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
            - ./ssl:/etc/nginx/ssl:ro # Mount SSL certificates if available
        networks:
            - app-network
        depends_on:
            api:
                condition: service_healthy
            client:
                condition: service_started
        healthcheck:
            test:
                ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost/health']
            interval: 30s
            timeout: 10s
            retries: 3

# Networks
networks:
    app-network:
        driver: bridge

# Volumes for persistence (if needed)
volumes:
    nginx_logs:
        driver: local

