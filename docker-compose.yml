services:
    # API Service
    api:
        build:
            context: .
            dockerfile: apps/api/Dockerfile
            target: development
        restart: unless-stopped
        ports:
            - '8081:8081'
        volumes:
            # Mount source code for hot reload
            - ./apps/api:/app/apps/api
            # Exclude node_modules from host
            - /app/node_modules
            - /app/apps/api/node_modules
        networks:
            - app-network
        environment:
            - NODE_ENV=development
        healthcheck:
            test: ['CMD', 'curl', '-f', 'http://localhost:8081/health']
            interval: 30s
            timeout: 10s
            retries: 3

    # Client Service
    client:
        build:
            context: .
            dockerfile: apps/client/Dockerfile
            target: development
        restart: unless-stopped
        ports:
            - '5173:5173'
        volumes:
            # Mount source code for hot reload
            - ./apps/client:/app/apps/client
            # Exclude node_modules from host
            - /app/node_modules
            - /app/apps/client/node_modules
        networks:
            - app-network
        environment:
            - NODE_ENV=development
            - VITE_API_URL=http://api:8081
        depends_on:
            - api

    # Production Nginx Reverse Proxy
    nginx:
        image: nginx:alpine
        restart: unless-stopped
        ports:
            - '8000:80'
        volumes:
            - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
        networks:
            - app-network
        depends_on:
            - api
            - client
        profiles:
            - production

# Networks
networks:
    app-network:
        driver: bridge

